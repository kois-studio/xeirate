contract_version: 0.2.0
standards_version: 0.4.0

standards_source:
  repository: https://github.com/kois-studio/engineering-standards
  revision: f86132fea80126008895b65f76342aaa095e98be

project:
  name: xeirate
  lifecycle: greenfield
  maturity: early-implementation

standards:
  - documentation
  - testing
  - typescript
  - security
  - dependencies
  - ci-cd
  - data
  - styling
  - web
  - operations

profiles:
  - angular-application

compliance:
  rules:
    - id: DOC-001
      status: compliant
      evidence: docs/AGENTS.md, docs/README.md, README.md
      priority: high
      next_action: Keep the documentation index and current-state map synchronized with implementation.
    - id: DOC-002
      status: compliant
      evidence: docs/README.md, docs/architecture/, docs/decisions/, docs/work/
      priority: high
      next_action: Add feature/workflow documentation as future slices become real.
    - id: DOC-003
      status: compliant
      evidence: docs/README.md and linked documentation map
      priority: medium
      next_action: Validate maintained links during documentation changes.
    - id: DOC-004
      status: compliant
      evidence: tracked docs use synthetic context; docs/SPEC.md is ignored
      priority: high
      next_action: Keep private discovery context out of tracked files and history.
    - id: DOC-005
      status: compliant
      evidence: docs/project-standards.yml and docs/work/TODO.md
      priority: high
      next_action: Update evidence and status after each implementation slice.
    - id: TEST-003
      status: compliant
      evidence: src/lib/persistence.test.ts, src/lib/scheduler.test.ts, src/lib/export.test.ts, bun test
      priority: high
      next_action: Add deterministic domain and persistence-boundary tests with the first implementation slice.
    - id: TEST-006
      status: compliant
      evidence: package.json, bun test
      priority: high
      next_action: Make the test command runnable locally and in CI.
    - id: TEST-008
      status: compliant
      evidence: src/lib/persistence.test.ts, src/lib/scheduler.test.ts, src/lib/export.test.ts, bun test
      priority: high
      next_action: Establish an automated quality baseline before calling the project implementation-ready.
    - id: TS-001
      status: compliant
      evidence: tsconfig.json, tsconfig.app.json, bun run typecheck
      priority: high
      next_action: Keep strict compiler and Angular template checks enabled as new features land.
    - id: TS-005
      status: compliant
      evidence: architecture/data-and-persistence.md
      priority: high
      next_action: Extend runtime validation as import and condition boundaries are added.
    - id: TS-007
      status: compliant
      evidence: tsconfig.json, biome.json, package.json
      priority: high
      next_action: Keep committed TypeScript, Angular, formatter, and linter configuration aligned.
    - id: TS-009
      status: compliant
      evidence: tsconfig.json, bun run typecheck
      priority: medium
      next_action: Keep checked indexed access options enabled in the Angular project.
    - id: TS-010
      status: compliant
      evidence: tsconfig.json, bun run typecheck
      priority: medium
      next_action: Keep the required compiler quality checks enabled.
    - id: SEC-001
      status: partial
      evidence: docs/architecture/proposed-system.md and docs/architecture/data-and-persistence.md
      priority: high
      next_action: Keep trust boundaries updated when import/export or hosting is added.
    - id: SEC-002
      status: compliant
      evidence: no secrets or runtime credentials are required by the local-only design
      priority: high
      next_action: Recheck bundles and repository history when integrations are considered.
    - id: SEC-004
      status: compliant
      evidence: docs/architecture/data-and-persistence.md
      priority: high
      next_action: Extend schema validation to future import and condition boundaries.
    - id: SEC-005
      status: partial
      evidence: local-only data boundary documented in docs/architecture/data-and-persistence.md
      priority: high
      next_action: Document retention/deletion behavior and minimize export contents.
    - id: DEP-001
      status: compliant
      evidence: package.json, bun.lock
      priority: high
      next_action: Commit a reproducible lockfile with the scaffold.
    - id: DEP-002
      status: compliant
      evidence: package.json packageManager, package.json engines
      priority: medium
      next_action: Pin the Bun toolchain used by the project.
    - id: DEP-003
      status: partial
      evidence: package.json packageManager and engines
      priority: high
      next_action: Use the same pinned Bun version in CI and document the runtime setup.
    - id: DEP-004
      status: partial
      evidence: package.json allowScripts
      priority: high
      next_action: Verify dependency lifecycle scripts and keep the allowlist minimal.
    - id: DEP-005
      status: compliant
      evidence: package.json and imports under src/
      priority: medium
      next_action: Reassess direct dependencies as the application grows.
    - id: DEP-006
      status: deferred
      evidence: docs/work/TODO.md; Bun scanner is not configured
      priority: high
      next_action: Select and pin a repeatable dependency vulnerability scanner before hosting or release.
    - id: DEP-007
      status: compliant
      evidence: package.json packageManager and bun.lock
      priority: medium
      next_action: Keep Bun consistent across local and CI environments.
    - id: CI-001
      status: planned
      evidence: work/TODO.md
      priority: medium
      next_action: Add CI quality gates after the local scripts are available.
    - id: DATA-001
      status: compliant
      evidence: docs/architecture/data-and-persistence.md, src/lib/domain.ts, src/lib/persistence.ts, src/lib/scheduler.ts
      priority: high
      next_action: Version future condition and schedule changes with explicit migrations.
    - id: DATA-002
      status: compliant
      evidence: src/lib/domain.ts, src/lib/persistence.ts, src/lib/persistence.test.ts
      priority: high
      next_action: Extend boundary validation as import/export is added.
    - id: DATA-003
      status: compliant
      evidence: src/lib/persistence.test.ts, src/lib/domain.ts
      priority: high
      next_action: Add migration tests for each future schema version.
    - id: STYLE-001
      status: compliant
      evidence: src/styles.css, Angular templates under src/app/, docs/architecture/proposed-system.md
      priority: medium
      next_action: Keep Tailwind as the only styling system and document any specialized CSS exception.
    - id: A11Y-001
      status: compliant
      evidence: Angular templates under src/app/, semantic form controls, dialog landmarks
      priority: high
      next_action: Retain a rendered accessibility audit for the critical workflow.
    - id: A11Y-002
      status: partial
      evidence: Angular button component, Tailwind focus-visible utilities, condition dialog escape handling
      priority: high
      next_action: Verify keyboard flow and visible focus states with a rendered browser audit.
    - id: A11Y-003
      status: partial
      evidence: Angular reactive forms, labels, aria-live workspace status, condition dialog labels
      priority: high
      next_action: Add retained assertions for labels, errors, and status messages.
    - id: A11Y-005
      status: partial
      evidence: Tailwind responsive utilities under src/app/
      priority: high
      next_action: Check mobile layout, contrast, zoom, and reduced motion behavior in a rendered audit.
    - id: WEB-001
      status: planned
      evidence: work/TODO.md
      priority: medium
      next_action: Add a rendered-page audit for the deployed static build.
    - id: ANGULAR-001
      status: compliant
      evidence: src/app/, angular.json, docs/decisions/0007-angular-standalone-and-tailwind-migration.md
      priority: high
      next_action: Keep future features organized by Angular capability and domain boundary.
    - id: ANGULAR-002
      status: compliant
      evidence: src/app/pages/, src/app/components/, src/app/services/workspace.service.ts, src/lib/
      priority: medium
      next_action: Keep domain and persistence code framework-independent.
    - id: ANGULAR-003
      status: compliant
      evidence: strict TypeScript contracts, typed WorkspaceService, signal-based component APIs, reactive form models
      priority: high
      next_action: Keep component inputs, outputs, and store commands explicit.
    - id: ANGULAR-004
      status: compliant
      evidence: src/app/components/condition-dialog/, src/app/components/people-view/, src/app/components/sessions-view/
      priority: medium
      next_action: Use reactive forms for future complex workflows.
    - id: ANGULAR-005
      status: compliant
      evidence: package.json, src/styles.css, Angular templates under src/app/
      priority: medium
      next_action: Keep Tailwind utilities as the primary styling and interaction vocabulary.
    - id: ANGULAR-006
      status: compliant
      evidence: src/lib/domain.ts Zod schemas, persistence loaders, form validation
      priority: high
      next_action: Validate every future import or external browser boundary before use.
    - id: ANGULAR-007
      status: compliant
      evidence: src/app/services/workspace.service.ts signal ownership and commands
      priority: high
      next_action: Keep state transitions in the store or focused feature services.
    - id: ANGULAR-008
      status: compliant
      evidence: src/lib/scheduler.ts and src/lib/*.test.ts
      priority: medium
      next_action: Preserve isolated deterministic tests for scheduling rules.
    - id: ANGULAR-010
      status: compliant
      evidence: signal computed state and Angular effect in WorkspaceService
      priority: high
      next_action: Keep effects bounded to lifecycle-owned browser side effects.
    - id: ANGULAR-011
      status: planned
      evidence: docs/work/TODO.md
      priority: medium
      next_action: Add a critical end-to-end browser journey.
    - id: ANGULAR-012
      status: compliant
      evidence: tsconfig.json angularCompilerOptions, bun run typecheck
      priority: high
      next_action: Keep strictTemplates, strictInjectionParameters, and strictInputAccessModifiers enabled.
    - id: ANGULAR-014
      status: partial
      evidence: workspace status messaging and empty states; localStorage has no remote loading state
      priority: medium
      next_action: Add explicit storage-unavailable/error presentation to the retained browser audit.
    - id: ANGULAR-015
      status: compliant
      evidence: scoped WorkspaceService signals and route-level page components
      priority: medium
      next_action: Keep client state scoped to the workspace feature.
    - id: ANGULAR-009
      status: not-applicable
      evidence: no authenticated routes or external effects
      priority: low
      next_action: Reassess if authentication or remote effects are introduced.
    - id: ANGULAR-013
      status: not-applicable
      evidence: local-only application with no authorization boundary
      priority: low
      next_action: Reassess if accounts or server authorization are introduced.
    - id: ASTRO-001
      status: superseded
      evidence: docs/decisions/0007-angular-standalone-and-tailwind-migration.md
      priority: low
      next_action: Use the Angular profile for current implementation reviews.
    - id: ASTRO-003
      status: superseded
      evidence: docs/decisions/0007-angular-standalone-and-tailwind-migration.md
      priority: low
      next_action: Use Angular feature boundaries for current implementation reviews.
    - id: ASTRO-007
      status: superseded
      evidence: docs/decisions/0007-angular-standalone-and-tailwind-migration.md
      priority: low
      next_action: Use Angular routes and standalone components for current implementation reviews.
    - id: ASTRO-009
      status: superseded
      evidence: docs/decisions/0007-angular-standalone-and-tailwind-migration.md
      priority: low
      next_action: Verify static Angular output instead.
    - id: ASTRO-012
      status: partial
      evidence: docs/decisions/0005-vercel-static-deployment.md, angular.json, bun run build
      priority: medium
      next_action: Add deliberate 404 behavior and keep static hosting configuration current.

exceptions:
  - id: runtime-service-rules
    scope: OPS-001..OPS-009
    status: not-applicable-for-now
    rationale: The intended first release is a static local-only site with no runtime service, backend, or remote data store. Build and hosting behavior still need documentation before deployment.
  - id: account-and-api-rules
    scope: SEC-003, SEC-007, API-001..API-008, CLERK-001..CLERK-007
    status: not-applicable-for-now
    rationale: The intended first release has no accounts, authentication, authorization service, or API.

deferred_work:
  - id: standards-001
    item: Add CI quality gates and a rendered browser audit.
    reason: The repository is being scaffolded locally before the first hosted workflow is chosen.
    priority: medium
  - id: standards-002
    item: Define static hosting headers, 404 behavior, and release procedure.
    reason: Hosting has not been selected.
    priority: medium
  - id: standards-003
    item: Configure repeatable dependency vulnerability scanning.
    reason: Bun provides the scan command but requires a separately selected scanner package.
    priority: high
